id = "worktree-parent"
name = "Worktree parent"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Reopen a repo's main checkout workspace when it closes while its worktree workspaces are still open"
platforms = ["macos", "linux"]

[[events]]
on = "workspace.closed"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/reopen-parents.sh\""]

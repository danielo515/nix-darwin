onboarding = false

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"

[theme]
name = "catppuccin"
auto_switch = false

[keys]
# Flip to the most recently focused pane, like tmux's prefix+;
last_pane = "prefix+;"
# Workspace switching; with two workspaces either one acts as a toggle
previous_workspace = "prefix+u"
next_workspace = "prefix+o"
# Previous tab on prefix+b; sidebar toggle moved off its default to make room
previous_tab = "prefix+b"
toggle_sidebar = "prefix+s"
# Sidebar toggle took prefix+s (the default settings key), so settings moves
# to the conventional comma (like Cmd+, on macOS)
settings = "prefix+,"

# Built-in goto (list + hint keys, / to search) replaced by the fzf jump popup below
goto = ""

# Fuzzy jump to any workspace or tab: prefix+g, then just type
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "$HOME/.config/herdr/jump.sh"
description = "Fuzzy jump to workspace/tab"
width = "90%"
height = "80%"

# prefix+d ("diff"); prefix+r is the default resize-mode binding
[[keys.command]]
key = "prefix+d"
type = "shell"
command = "herdr plugin action invoke toggle --plugin persiyanov.reviewr"
description = "Toggle reviewr sidebar"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
description = "Open file viewer"

# prefix+y ("lazY git"); prefix+g is the default goto binding
[[keys.command]]
key = "prefix+y"
type = "popup"
command = 'cd "${HERDR_ACTIVE_PANE_CWD:-$PWD}" && lazygit'
description = "Lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = 'cd "${HERDR_ACTIVE_PANE_CWD:-$PWD}" && exec "${SHELL:-sh}"'
description = "Scratch terminal"
width = "80%"
height = "70%"

# Worktrunk-backed worktrees (plugin id "worktrunk"); prefix+shift+g overrides
# herdr's built-in "new worktree" so wt hooks run on create/remove/merge
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "worktrunk.merge"
description = "Worktree: merge into the target branch"
